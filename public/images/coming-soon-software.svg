<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="csBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101E" />
      <stop offset="50%" stop-color="#081528" />
      <stop offset="100%" stop-color="#0A1C34" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#06101E" stop-opacity="0" />
    </radialGradient>

    <pattern id="csGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#csBgGrad)" />
  <rect width="800" height="450" fill="url(#csGrid)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="180" r="160" fill="url(#cyanGlow)" />

  <!-- Central Futuristic Innovation Icon -->
  <g transform="translate(400, 160)">
    <!-- Tech Outer Hexagon -->
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="none" stroke="rgba(0, 229, 153, 0.3)" stroke-width="1.5" stroke-dasharray="6 4" />
    
    <!-- Inner Circuit Nodes -->
    <circle cx="0" cy="0" r="28" fill="rgba(0, 229, 153, 0.1)" stroke="#00E599" stroke-width="2" />
    
    <!-- Spark / Chip / Energy Bolt Core -->
    <path d="M-6 -14 L4 -3 L-2 -1 L6 14 L-4 3 L2 1 Z" fill="#00E599" />

    <!-- Pulse Rings -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="rgba(0, 212, 255, 0.2)" stroke-width="1" />
  </g>

  <!-- Title -->
  <text x="400" y="275" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#FFFFFF" letter-spacing="1.5">
    INNOVACIÓN CONTINUA
  </text>

  <!-- Coming Soon Pill -->
  <rect x="290" y="305" width="220" height="28" rx="14" fill="rgba(0, 229, 153, 0.12)" stroke="rgba(0, 229, 153, 0.35)" stroke-width="1" />
  <text x="400" y="323" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#00E599" letter-spacing="2">
    • PRÓXIMAMENTE •
  </text>
</svg>
