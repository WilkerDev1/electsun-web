<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101E" />
      <stop offset="50%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#0E2442" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#FF8A00" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0A192F" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#gridPattern)" />

  <!-- Ambient Sun Glow -->
  <circle cx="400" cy="190" r="180" fill="url(#sunGlow)" />

  <!-- Geometric Solar Tech Icon -->
  <g transform="translate(400, 165)">
    <!-- Outer Orbit Ring with nodes -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="rgba(255, 184, 0, 0.25)" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle cx="0" cy="-62" r="4" fill="#00E599" />
    <circle cx="54" cy="31" r="3.5" fill="#00D4FF" />
    <circle cx="-54" cy="31" r="3.5" fill="#FFB800" />

    <!-- Sun Core Rays -->
    <g stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="-44" x2="0" y2="-36" />
      <line x1="0" y1="36" x2="0" y2="44" />
      <line x1="-44" y1="0" x2="-36" y2="0" />
      <line x1="36" y1="0" x2="44" y2="0" />
      <line x1="-31" y1="-31" x2="-25" y2="-25" />
      <line x1="25" y1="25" x2="31" y2="31" />
      <line x1="31" y1="-31" x2="25" y2="-25" />
      <line x1="-25" y1="25" x2="-31" y2="31" />
    </g>

    <!-- Glowing Sun Center with Photovoltaic Grid -->
    <circle cx="0" cy="0" r="26" fill="url(#goldGrad)" />
    <!-- PV Silicon Wafer Inner Symbol -->
    <path d="M-10 -10 L10 -10 L10 10 L-10 10 Z" fill="#0A192F" opacity="0.85" rx="3" />
    <path d="M-10 0 L10 0 M0 -10 L0 10" stroke="#FFB800" stroke-width="1.5" />
  </g>

  <!-- Brand Typography -->
  <text x="400" y="285" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="2">
    SOLAR<tspan fill="url(#goldGrad)">SIM</tspan>
  </text>

  <!-- Tagline / Badge -->
  <rect x="300" y="315" width="200" height="26" rx="13" fill="rgba(255, 184, 0, 0.12)" stroke="rgba(255, 184, 0, 0.3)" stroke-width="1" />
  <text x="400" y="332" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FFB800" letter-spacing="2.5">
    AI QUOTATION &amp; SIMULATION
  </text>
</svg>
