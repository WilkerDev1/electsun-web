services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: electsun-web:latest
    container_name: electsun-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/dev.db
      - NEXTAUTH_URL=https://electsun.net
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-electsun-super-secure-production-key-2026}
      - AUTH_SECRET=${AUTH_SECRET:-electsun-super-secure-production-key-2026}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
    networks:
      - solarsim_net

networks:
  solarsim_net:
    external: true
