services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: electsun-web:latest
    container_name: electsun-web
    restart: unless-stopped
    # Secretos solo en el servidor (ver .env.example); este archivo nunca va a git.
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXTAUTH_URL=https://electsun.net
    volumes:
      - ./uploads:/app/public/uploads
    networks:
      - solarsim_net

networks:
  solarsim_net:
    external: true
